services:
  frontend:
    build:
      context: .
      target: development
    environment:
      - VITE_API_BASE_URL=http://localhost:5001/api
    ports:
      - "8080:8080"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.ts:/app/vite.config.ts
